# packages/core/Cargo.toml
[package]
name = "bl1nk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9" # ถ้าเราจะใช้ YAML

# Async
tokio = { version = "1", features = ["full"] }

# File System & Glob
glob = "0.3"
fs-extra = "1.3"

# Error Handling
thiserror = "1.0"

# CLI (อาจจะไม่ต้องใช้ใน core แต่มีไว้เผื่อ test)
# clap = { version = "4.0", features = ["derive"] }
